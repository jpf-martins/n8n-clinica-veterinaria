<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e7490">
  <title>Clínica Veterinária | Administração</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #24343a; background: #f3f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .app { width: min(100%, 760px); height: min(88vh, 820px); min-height: 520px; display: flex; flex-direction: column; overflow: hidden; background: #fff; border: 1px solid #d9e6e9; border-radius: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border-bottom: 1px solid #e3edef; }
    h1 { font-size: 18px; margin: 0; line-height: 1.2; }
    .back { color: #0e7490; background: #fff; border: 1px solid #c7dfe5; border-radius: 7px; padding: 8px 11px; font-size: 13px; text-decoration: none; white-space: nowrap; }
    .back:hover { background: #eef8fb; }
    .statusbar { display: flex; align-items: center; gap: 7px; padding: 8px 22px; font-size: 12px; color: #63767c; border-bottom: 1px solid #eaf1f3; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #d19b4f; }
    .dot.online { background: #0891b2; }
    .dot.offline { background: #c76363; }
    main { flex: 1; overflow-y: auto; padding: 24px; background: #fff; }
    .intro { margin: 24px auto; text-align: center; color: #7b8d92; font-size: 17px; }
    .messages { display: flex; flex-direction: column; gap: 13px; }
    .row { display: flex; max-width: min(80%, 560px); }
    .row.user { align-self: flex-end; }
    .row.bot, .row.error { align-self: flex-start; }
    .bubble { padding: 11px 14px; border-radius: 11px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
    .bot .bubble { background: #f1f6f8; }
    .user .bubble { background: #0e7490; color: #fff; }
    .error .bubble { background: #fff2f0; color: #963f36; }
    .composer { padding: 15px 20px; border-top: 1px solid #e3edef; background: #fff; }
    form { display: flex; gap: 10px; }
    input { min-width: 0; height: 48px; flex: 1; padding: 11px 13px; border-radius: 8px; border: 1px solid #cbdde2; font: inherit; outline: 0; }
    input:focus { border-color: #0e7490; }
    button { font: inherit; }
    .send { height: 48px; padding: 0 18px; color: #fff; background: #0e7490; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .send:hover { background: #155e75; }
    .send:disabled, input:disabled { opacity: .55; cursor: not-allowed; }
    .hint { margin: 10px 1px 0; color: #718187; font-size: 12px; }
    @media (max-width: 620px) { body { padding: 0; } .app { height: 100dvh; min-height: 0; border: 0; border-radius: 0; } header { padding: 14px; } main { padding: 18px 12px; } .row { max-width: 88%; } .composer { padding: 12px; } h1 { font-size: 16px; } }
  </style>
</head>
<body>
  <div class="app">
    <header><h1>Administração</h1><a class="back" href="/">Chat do cliente</a></header>
    <div class="statusbar"><span class="dot" id="dot"></span><span id="status">Verificando acesso…</span></div>
    <main id="scroll-area">
      <div class="intro" id="intro">Digite um comando para começar.</div>
      <div class="messages" id="messages" aria-live="polite"></div>
    </main>
    <div class="composer">
      <form id="form"><input id="command" aria-label="Comando administrativo" placeholder="Digite um comando…" autocomplete="off" maxlength="500" required disabled><button class="send" id="send" type="submit" disabled>Enviar</button></form>
      <p class="hint">/ajuda · /notificacoes · /listar pendentes · /aprovar ID</p>
    </div>
  </div>
  <script>
    const chatPath = '/api/admin';
    const sessionId = crypto.randomUUID();
    const field = document.getElementById('command');
    const send = document.getElementById('send');
    const status = document.getElementById('status');
    const dot = document.getElementById('dot');
    const messages = document.getElementById('messages');
    const scrollArea = document.getElementById('scroll-area');

    function bubble(role, text) {
      const row = document.createElement('div');
      row.className = `row ${role}`;
      const content = document.createElement('div');
      content.className = 'bubble';
      content.textContent = text;
      row.append(content);
      messages.append(row);
      document.getElementById('intro').hidden = true;
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    function loginUrl() {
      return '/signin?redirect=' + encodeURIComponent(window.location.href);
    }

    async function verifyLogin() {
      try {
        const response = await fetch('/rest/login', {
          method: 'GET',
          headers: { 'browser-id': localStorage.getItem('n8n-browserId') || '' },
          credentials: 'same-origin',
          cache: 'no-store',
        });
        if (response.status !== 200) {
          window.location.replace(loginUrl());
          return;
        }
        dot.className = 'dot online';
        status.textContent = 'Acesso autorizado';
        field.disabled = send.disabled = false;
        field.focus();
      } catch {
        dot.className = 'dot offline';
        status.textContent = 'Não foi possível verificar o login';
      }
    }

    function responseText(value) {
      if (typeof value === 'string') return value;
      if (Array.isArray(value)) return value.map(responseText).filter(Boolean).join('\n');
      if (value && typeof value === 'object') {
        for (const key of ['text', 'output', 'resposta', 'message', 'json', 'data']) {
          const result = responseText(value[key]);
          if (result) return result;
        }
      }
      return '';
    }

    document.getElementById('form').addEventListener('submit', async event => {
      event.preventDefault();
      const command = field.value.trim();
      if (!command || field.disabled) return;
      field.value = '';
      field.disabled = send.disabled = true;
      status.textContent = 'Executando comando…';
      bubble('user', command);
      try {
        const response = await fetch(chatPath, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ action: 'sendMessage', sessionId, chatInput: command }),
        });
        if (response.status === 401 || response.status === 403) {
          window.location.replace(loginUrl());
          return;
        }
        if (!response.ok) throw new Error(`O n8n respondeu ${response.status}. Confira a execução antes de reenviar.`);
        const raw = await response.text();
        let result;
        try { result = JSON.parse(raw); }
        catch { result = raw; }
        const answer = responseText(result);
        if (!answer) throw new Error('O n8n não devolveu uma resposta. Confira a execução antes de reenviar.');
        bubble('bot', answer);
      } catch (error) {
        bubble('error', error.message || 'Não foi possível enviar o comando.');
      } finally {
        status.textContent = 'Acesso autorizado';
        field.disabled = send.disabled = false;
        field.focus();
      }
    });

    verifyLogin();
  </script>
</body>
</html>
